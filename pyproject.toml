[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "spiflash"
dynamic = ["version"]
description = "A database of SPI flash chips (JEDEC ids, sizes, erase geometry, features), merged from Linux, U-Boot, flashrom, flashprog, OpenOCD and openFPGALoader."
readme = "README.md"
requires-python = ">=3.11"
# PEP 621 table form, not PEP 639's `license = "Apache-2.0"` plus
# `license-files = [...]`: Debian bookworm's hatchling 1.12 rejects the latter
# and the deb is built with it. LICENSE is included without license-files.
license = { text = "Apache-2.0" }
authors = [{ name = "Tim Ansell", email = "me@mith.ro" }]
keywords = ["spi", "flash", "spi-nor", "spi-nand", "jedec", "jep106", "sfdp", "flashrom", "fpga"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mithro/spiflash"
Issues = "https://github.com/mithro/spiflash/issues"

[project.scripts]
spiflash = "spiflash.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pytest-cov>=5.0"]
# The Read the Docs site (docs/conf.py); its chip and vendor pages are
# generated from the package's own data at build time.
docs = ["sphinx>=8", "furo>=2024.8", "myst-parser>=4", "sphinx-design>=0.6",
        "sphinx-copybutton>=0.5", "types-docutils"]

# Rolling release: the version is derived from git (`git describe`), never
# hand-edited. vX.Y tags are the only human input (v0.0 on the root commit);
# every commit after a tag increments the distance, so post-release versioning
# yields a real, monotonic version: X.Y at the tag, X.Y.postN N commits later.
# "no-local-version" keeps it PyPI-upload safe.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/spiflash/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spiflash"]

# The sdist carries the generator too, so the database can be rebuilt from it.
[tool.hatch.build.targets.sdist]
include = ["src/", "tools/", "tests/", "README.md", "LICENSE", "docs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra --cov=spiflash --cov=spiflash_extract --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
target-version = "py311"
# Import roots: ruff sorts imports against these, and knows the docs' conf.py
# and extension are top-level modules, not parts of a package.
src = ["src", "tools", "tests", "docs", "docs/_ext"]
line-length = 100
extend-exclude = ["src/spiflash/_version.py", "upstream"]

[tool.ruff.format]
# Only Python files: the README's examples line their comments up in a column
# on purpose, which the formatter would undo.
exclude = ["*.md"]

[tool.ruff.lint]
# Everything that is about the code, not about taste: pycodestyle, pyflakes,
# imports, upgrades, bugbear, simplify, ruff's own, pytest style, typing-only
# imports, comprehensions, returns, naming, builtins, unused arguments, string
# concatenation, performance, refurb, pygrep, pathlib, commented-out code,
# exception messages, boolean traps, private access, pylint's convention,
# error and warning checks, debuggers, sys.version, raise, logging, blind
# except, datetimes, import conventions, namespace packages, tidy imports and
# f-strings. Not selected: S (flags every pytest assert), T20 (the CLI prints
# on purpose), D (docstrings on every test) and pylint's refactor heuristics
# (PLR): none of them can be met without suppressions, and there are none.
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT", "TC", "C4", "PIE", "RET", "N", "A",
    "ARG", "ISC", "PERF", "FURB", "PGH", "PTH", "ERA", "EM", "FBT", "SLF", "PLC", "PLE", "PLW",
    "T10", "YTT", "RSE", "G", "LOG", "BLE", "DTZ", "ICN", "INP", "TID", "FLY",
]

[tool.mypy]
files = [
    "src/spiflash", "tools/spiflash_extract", "tools/update_db.py",
    "docs/conf.py", "docs/_ext/spiflash_pages.py",
]
mypy_path = ["src", "tools", "docs/_ext"]
strict = true
# No python_version: mypy checks against the interpreter running it, and CI
# runs it under every supported Python, each with the packages it resolves to.

[[tool.mypy.overrides]]
module = "spiflash._version"
ignore_errors = true
