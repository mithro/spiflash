[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "spiflash"
dynamic = ["version"]
description = "A database of SPI flash chips (JEDEC ids, sizes, erase geometry, features), merged from Linux, U-Boot, flashrom, flashprog, OpenOCD and openFPGALoader."
readme = "README.md"
requires-python = ">=3.11"
# PEP 621 table form, not PEP 639's `license = "Apache-2.0"` plus
# `license-files = [...]`: Debian bookworm's hatchling 1.12 rejects the latter
# and the deb is built with it. LICENSE is included without license-files.
license = { text = "Apache-2.0" }
authors = [{ name = "Tim Ansell", email = "me@mith.ro" }]
keywords = ["spi", "flash", "spi-nor", "spi-nand", "jedec", "jep106", "sfdp", "flashrom", "fpga"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mithro/spiflash"
Issues = "https://github.com/mithro/spiflash/issues"

[project.scripts]
spiflash = "spiflash.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pytest-cov>=5.0"]

# Rolling release: the version is derived from git (`git describe`), never
# hand-edited. vX.Y tags are the only human input (v0.0 on the root commit);
# every commit after a tag increments the distance, so post-release versioning
# yields a real, monotonic version: X.Y at the tag, X.Y.postN N commits later.
# "no-local-version" keeps it PyPI-upload safe.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/spiflash/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spiflash"]

# The sdist carries the generator too, so the database can be rebuilt from it.
[tool.hatch.build.targets.sdist]
include = ["src/", "tools/", "tests/", "README.md", "LICENSE", "docs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra --cov=spiflash --cov=spiflash_extract --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
target-version = "py311"
src = ["src", "tools", "tests"]
line-length = 100
extend-exclude = ["src/spiflash/_version.py", "upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "TC", "C4", "PIE", "RET", "N"]

[tool.ruff.lint.per-file-ignores]
# Tests assert several facts about one record at a time; splitting each into
# its own statement buries what is being checked.
"tests/*" = ["PT018"]
# The fixtures are the upstream formats verbatim, tabs and long lines included.
"tests/test_extract.py" = ["PT018", "E101", "E501", "W191"]

[tool.mypy]
files = ["src/spiflash", "tools/spiflash_extract", "tools/update_db.py"]
mypy_path = ["src", "tools"]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = "spiflash._version"
ignore_errors = true
