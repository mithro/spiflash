# https://spiflash.readthedocs.io/ -- built from docs/ (see docs/conf.py).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # Read the Docs clones shallowly; hatch-vcs needs the tags to derive the
    # version the site shows.
    post_checkout:
      - git fetch --unshallow --tags || true
    # The default build is serial, and with a page per chip it no longer fits
    # the 15-minute limit; this is the default command with -j auto added.
    build:
      html:
        - python -m sphinx -T -W --keep-going -j auto -b html -d _build/doctrees -D language=en docs $READTHEDOCS_OUTPUT/html

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
