# The upstream trees the spiflash database is extracted from.
#
# `uv run tools/update_db.py` rebuilds src/spiflash/data/ from exactly these
# commits, so the committed data is reproducible; `--latest` first moves every
# pin to the head of its branch. Only `paths` are fetched (a sparse, blobless,
# depth-1 fetch of one commit), into upstream/<name>/.
#
# `browse` (optional) is where to link to a file when `url` is not GitHub.
# `license` is the upstream's licence for the files read. The database holds
# facts about chips (ids, sizes, opcodes) taken from them, not their code; see
# docs/SOURCES.md.

[flashrom]
url = "https://github.com/flashrom/flashrom"
branch = "main"
commit = "a1de15b26bfd2c9759378f835fe3b9a2d9ac08e1"
paths = ["flashchips/", "flashchips.c", "include/flashchips.h", "include/flash.h", "include/spi.h"]
license = "GPL-2.0-or-later"

[flashprog]
url = "https://review.sourcearcade.org/flashprog.git"
# Where to link to a file in it: the official GitHub mirror.
browse = "https://github.com/SourceArcade/flashprog"
branch = "main"
commit = "bbe7393f16b710d7e5ddfb1d01c6dadd8c0a5aa7"
paths = ["flashchips.c", "include/flashchips.h", "include/flash.h", "include/spi.h"]
license = "GPL-2.0-or-later"

[linux]
url = "https://github.com/torvalds/linux"
branch = "master"
commit = "fd179f8a05be3ccae366b9b96e176b51fbe54aab"
paths = ["drivers/mtd/spi-nor/", "drivers/mtd/nand/spi/", "include/linux/mtd/spi-nor.h"]
license = "GPL-2.0-only"

[u-boot]
url = "https://github.com/u-boot/u-boot"
branch = "main"
commit = "a06e89ab05eaa2b8344d521319399333cd760ae5"
paths = ["drivers/mtd/spi/spi-nor-ids.c", "drivers/mtd/spi/sf_internal.h", "include/linux/mtd/spi-nor.h"]
license = "GPL-2.0-or-later"

[dediprog]
url = "https://github.com/DediProgSW/SF100Linux"
branch = "master"
commit = "091d257173afb3e1a34f3af3bb28e883dab67221"
# UTF-16 XML, one <Chip .../> per line.
paths = ["ChipInfoDb.dedicfg"]
# Its LICENSE is the GPL, version 2; the files carry no licence header.
license = "GPL-2.0-only"

[rockchip]
url = "https://github.com/rockchip-linux/u-boot"
# next-dev is the branch Rockchip maintains rkflash on, and the default one;
# v5, on a newer U-Boot, has no rkflash.
branch = "next-dev"
commit = "1c535d65b8509f388d09e49fb6961f49fda35a1d"
paths = [
    "drivers/rkflash/sfc_nor.c",
    "drivers/rkflash/sfc_nor.h",
    "drivers/rkflash/sfc_nand.c",
    "drivers/rkflash/sfc_nand.h",
    "drivers/rkflash/sfc.h",
]
license = "GPL-2.0-only"

[openocd]
url = "https://github.com/openocd-org/openocd"
branch = "master"
commit = "21f88d7815edfb7632548090934c51017604f450"
paths = ["src/flash/nor/spi.c", "src/flash/nor/spi.h", "src/helper/jep106.inc"]
license = "GPL-2.0-or-later"

[openfpgaloader]
url = "https://github.com/trabucayre/openFPGALoader"
branch = "master"
commit = "676e53ec73d2261c974d610b7cf0693117c8d2ef"
paths = ["src/spiFlashdb.hpp", "src/spiFlash.cpp"]
license = "Apache-2.0"

[imsprog]
url = "https://github.com/bigbigmdm/IMSProg"
branch = "main"
commit = "9f7d14ec9e7f6b4e7d1508bd45bd4a946c292779"
# A binary file: see tools/spiflash_extract/imsprog.py.
paths = ["IMSProg_programmer/database/IMSProg.Dat"]
license = "GPL-3.0-or-later"

[qemu]
url = "https://gitlab.com/qemu-project/qemu.git"
# Where to link to a file in it: the official GitHub mirror.
browse = "https://github.com/qemu/qemu"
branch = "master"
commit = "81ce3a87737aa50716c42db8886082d12783e0a1"
paths = ["hw/block/m25p80.c", "hw/block/m25p80_sfdp.c", "hw/block/m25p80_sfdp.h"]
license = "GPL-2.0-or-later"

[zephyr]
url = "https://github.com/zephyrproject-rtos/zephyr"
branch = "main"
commit = "9f0253dcc66ccecc92a699dd81cb1034c3f6875b"
# Only the devicetree files: boards/ is mostly photographs.
paths = ["boards/**/*.dts", "boards/**/*.dtsi", "boards/**/*.overlay", "dts/**/*.dtsi"]
license = "Apache-2.0"
